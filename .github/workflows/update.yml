name: update

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
    - cron: "0 3 * * *"    # 毎日 12:00 JST
  workflow_dispatch:        # Actionsタブから手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 取得・差分検出
        run: node scripts/update.mjs
           - name: 履歴をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@://github.com"
          git add data/state.json
          
          # 変更がある場合のみ、コミット・プル・プッシュを実行する
          if ! git diff --cached --quiet; then
            git commit -m "update $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push origin main
          else
            echo "変更がないため、プッシュをスキップします。"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
