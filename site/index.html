<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2d4a">
<title>平塚 入荷メモ</title>
<style>
:root{
  --bg:#f6f8fa; --surface:#ffffff; --ink:#132338; --sub:#5b6878; --line:#dde3ea;
  --sea:#0f2d4a; --here:#0a7f6c; --here-bg:#e3f4f0; --away:#9a6a0a; --away-bg:#fbf1dc;
  --alert:#b8322a; --alert-bg:#fbe7e5; --new:#2458c6; --new-bg:#e6edfb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1622; --surface:#132131; --ink:#e7edf4; --sub:#9aa8b8; --line:#243548;
    --sea:#081421; --here:#4fd1b6; --here-bg:#123a35; --away:#f0bd5a; --away-bg:#3a2d12;
    --alert:#ff8a80; --alert-bg:#3d1d1b; --new:#8fb1ff; --new-bg:#1b2a4a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:16px;line-height:1.5;font-feature-settings:"palt";}
header{position:sticky;top:0;z-index:5;background:var(--sea);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:0;
  background:#fff;color:#132338;outline:none}
.search input:focus-visible{box-shadow:0 0 0 3px #7fd6c5}
.search button{font:inherit;font-size:15px;border:0;border-radius:12px;padding:12px;background:rgba(255,255,255,.14);color:#fff}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
  background:transparent;color:#fff}
.chip[aria-pressed="true"]{background:#fff;color:var(--sea);border-color:#fff;font-weight:700}
.chip.store[aria-pressed="true"]{background:#7fd6c5;border-color:#7fd6c5;color:#08221d}
.chip:disabled{opacity:.4}
.status{font-size:13px;color:var(--sub);padding:10px 14px 0}
main{padding:0 0 calc(env(safe-area-inset-bottom) + 96px)}
.postbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;gap:8px;align-items:center;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--sea);color:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.postbar.show{display:flex}
.postbar span{flex:1;font-size:15px}
.postbar button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:10px 14px}
.postbar .make{background:#7fd6c5;color:#08221d;font-weight:700}
.postbar .clear{background:rgba(255,255,255,.14);color:#fff}
.pick{display:block;width:100%;font:inherit;font-size:14px;padding:10px;border-radius:10px;margin-bottom:10px;
  border:1px dashed var(--line);background:var(--bg);color:var(--ink)}
.pick[aria-pressed="true"]{border-style:solid;border-color:var(--here);color:var(--here);background:var(--here-bg);font-weight:700}
.tag.post{background:#1d9bf0;color:#fff}
#composer{width:min(96vw,560px);max-height:92vh;overflow:auto}
#composer textarea{width:100%;min-height:220px;font:inherit;font-size:15px;line-height:1.6;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.count{text-align:right;font-size:13px;margin-top:4px;color:var(--sub)}
.count.over{color:var(--alert);font-weight:700}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tagpick button{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sub)}
.tagpick button[aria-pressed="true"]{border-color:#1d9bf0;color:#1d9bf0;font-weight:700}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.imgs a{display:block;overflow:hidden;border-radius:8px}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line)}
.day{position:sticky;top:var(--hdr,112px);z-index:2;background:var(--bg);
  padding:14px 14px 6px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.day b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.day span{font-size:14px;color:var(--sub)}
.day .rel{color:var(--here);font-weight:700}
.row{background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 14px;width:100%;text-align:left;
  font:inherit;color:inherit;background:none;border:0}
.head:focus-visible{outline:3px solid var(--here);outline-offset:-3px}
.row img,.row .noimg{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--line)}
.name{font-size:15px;line-height:1.45;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:700}
.tag.here{background:var(--here-bg);color:var(--here)}
.tag.away{background:var(--away-bg);color:var(--away)}
.tag.moved{background:var(--alert-bg);color:var(--alert)}
.tag.new{background:var(--new-bg);color:var(--new)}
.row.off .name{color:var(--sub)}
.detail{display:none;padding:0 14px 14px}
.row.open .detail{display:block}
.st-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.st-buttons button{font:inherit;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink)}
.st-buttons button[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.st-buttons .稼働中[aria-pressed="true"]{color:var(--here);background:var(--here-bg)}
.st-buttons .保管中[aria-pressed="true"]{color:var(--new);background:var(--new-bg)}
.st-buttons .在庫切れ[aria-pressed="true"]{color:var(--alert);background:var(--alert-bg)}
.tag.稼働中{background:var(--here);color:var(--surface)}
.tag.保管中{background:var(--new);color:var(--surface)}
.tag.在庫切れ{background:var(--alert);color:var(--surface)}
.chip.st[aria-pressed="true"]{background:#ffd27a;border-color:#ffd27a;color:#2b1d00}
.gear{font:inherit;font-size:15px;border:0;border-radius:12px;padding:12px;background:rgba(255,255,255,.14);color:#fff}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:18px;margin:0 0 12px}
dialog label{display:block;font-size:14px;margin:12px 0 4px;color:var(--sub)}
dialog input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog .actions button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog .actions .primary{background:var(--sea);color:#fff;border-color:var(--sea)}
dialog p{font-size:13px;color:var(--sub);margin:8px 0 0}
.detail img{width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--line)}
.detail p{margin:8px 0 0;font-size:14px;color:var(--sub)}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}
mark{background:#ffe38a;color:#132338;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<header id="hdr">
  <div class="search">
    <input id="q" type="search" name="search" inputmode="search" placeholder="作品名・キャラ名で検索"
      autocomplete="off" enterkeyhint="search" data-1p-ignore data-lpignore="true">
    <button id="clear" type="button" aria-label="検索語を消す">消す</button>
    <button id="gear" class="gear" type="button" aria-label="同期の設定">⚙</button>
  </div>
  <div class="chips" role="group" aria-label="絞り込み">
    <button class="chip store" id="onlyHere" aria-pressed="true">平塚のみ</button>
    <button class="chip" data-range="today">今日</button>
    <button class="chip" data-range="week">今週</button>
    <button class="chip" data-range="next">来週</button>
    <button class="chip" data-range="future">今後すべて</button>
    <button class="chip" data-range="past">入荷済み</button>
    <button class="chip st" data-st="稼働中">稼働中</button>
    <button class="chip st" data-st="保管中">保管中</button>
    <button class="chip st" data-st="在庫切れ">在庫切れ</button>
  </div>
</header>
<p class="status" id="status">読み込み中…</p>
<main id="list"></main>

<div class="postbar" id="postbar">
  <span id="postCount"></span>
  <button type="button" class="clear" id="postClear">解除</button>
  <button type="button" class="make" id="postMake">投稿文を作る</button>
</div>

<dialog id="composer">
  <h2>稼働開始のお知らせ</h2>
  <label for="cPlace">稼働場所</label>
  <input id="cPlace" type="text" autocomplete="off" data-1p-ignore data-lpignore="true">
  <label>ハッシュタグ（タップで切り替え）</label>
  <div class="tagpick" id="cTags"></div>
  <label for="cFixed">いつも付けるタグ（空白区切り）</label>
  <input id="cFixed" type="text" autocomplete="off" data-1p-ignore data-lpignore="true">
  <label for="cText">投稿文（ここで直接直せます）</label>
  <textarea id="cText"></textarea>
  <div class="count" id="cCount"></div>
  <label>画像（長押しで保存 → 投稿に添付。最大4枚）</label>
  <div class="imgs" id="cImgs"></div>
  <div class="actions">
    <button type="button" id="cClose">閉じる</button>
    <button type="button" id="cOpenX">Xで開く</button>
    <button type="button" id="cCopy" class="primary">コピー</button>
  </div>
  <p id="cInfo"></p>
</dialog>

<dialog id="settings">
  <form method="dialog" autocomplete="on">
    <h2>在庫状態の同期</h2>
    <label for="syncUrl">Apps Script のURL</label>
    <input id="syncUrl" name="username" type="text" inputmode="url" autocomplete="username"
      placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" spellcheck="false">
    <label for="syncKey">合言葉（スクリプトに設定したKEY）</label>
    <input id="syncKey" name="password" type="password" autocomplete="current-password">
    <p id="syncInfo"></p>
    <div class="actions">
      <button id="syncNow" type="button">今すぐ同期</button>
      <button id="closeSettings" type="submit" class="primary">保存して閉じる</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = { q: "", range: "week", onlyHere: true, stFilter: "", data: null };
const WD = ["日","月","火","水","木","金","土"];
const STATUSES = ["稼働中","保管中","在庫切れ"];

// ---------- 在庫状態（端末に保存＋任意でスプレッドシートと同期） ----------
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let statuses = ls.get("statuses", {});        // { id: { s: "稼働中"|"保管中"|"在庫切れ"|"", t: ミリ秒 } }
let pending  = new Set(ls.get("pending", [])); // まだ送れていない変更のID
let sync     = ls.get("sync", { url: "", key: "", last: 0 });
let syncMsg  = "";

function saveLocal(){ ls.set("statuses", statuses); ls.set("pending", [...pending]); }
function merge(remote){
  for (const [id, r] of Object.entries(remote || {})){
    const l = statuses[id];
    if (!l || r.t > l.t){ statuses[id] = r; pending.delete(id); }
    else if (l.t === r.t) pending.delete(id);
  }
}
function setStatus(id, s){
  const before = statuses[id]?.s;
  statuses[id] = { s, t: Date.now() };
  if (s === "稼働中" && before !== "稼働中") postSel.add(id);   // 稼働中にしたら投稿候補へ
  if (s !== "稼働中") postSel.delete(id);
  savePost();
  pending.add(id); saveLocal(); render(); schedulePush();
}

let pushTimer;
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); }
async function push(){
  if (!sync.url || !pending.size) return;
  const byId = Object.fromEntries((state.data?.prizes || []).map(p => [p.id, p.name]));
  const updates = [...pending].map(id => ({ id, ...statuses[id], name: byId[id] || "" }));
  try {
    const res = await fetch(sync.url, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ key: sync.key, updates }) });
    const j = await res.json();
    if (j.error) throw new Error(j.error);
    for (const u of updates) if (statuses[u.id]?.t === u.t) pending.delete(u.id);
    merge(j.statuses); done();
  } catch (e) { fail(e); }
}
async function pull(){
  if (!sync.url) return;
  try {
    const res = await fetch(`${sync.url}?key=${encodeURIComponent(sync.key)}`);
    const j = await res.json();
    if (j.error) throw new Error(j.error);
    merge(j.statuses); done();
    if (pending.size) push();
  } catch (e) { fail(e); }
}
function done(){ sync.last = Date.now(); ls.set("sync", sync); syncMsg = ""; saveLocal(); render(); }
function fail(e){
  syncMsg = e.message === "unauthorized"
    ? "同期できません: 合言葉が違います"
    : `同期できません: ${e.message}（変更は端末に保存済み）`;
  render();
}

// ---------- 表示 ----------
function norm(s){
  return s.normalize("NFKC").toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s・･\-‐‑–—―ｰー〜～~「」『』【】()（）\[\]!！?？☆★♪.。,、:：\/]/g, "")
    // 長音のゆれを吸収（ゆうた＝ゆた、ばくごう＝ばくご）
    .replace(/([おこごそぞとどのほぼぽもよろをょぉ])[うお]/g, "$1")
    .replace(/([うくぐすずつづぬふぶぷむゆるゅぅ])う/g, "$1");
}
function addDays(ymd, n){ const d=new Date(ymd+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dow(ymd){ return new Date(ymd+"T00:00:00Z").getUTCDay(); }
function jstToday(){ return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo"}).format(new Date()); }
function rangeOf(key, today){
  const mon = addDays(today, -((dow(today)+6)%7));
  switch(key){
    case "today":  return [today, today];
    case "week":   return [mon, addDays(mon,6)];
    case "next":   return [addDays(mon,7), addDays(mon,13)];
    case "future": return [today, "9999-12-31"];
    case "past":   return ["0000-01-01", addDays(today,-1)];
    default:       return ["0000-01-01", "9999-12-31"];
  }
}
function relLabel(d, today){
  const diff = Math.round((new Date(d) - new Date(today)) / 864e5);
  return diff===0?"今日":diff===1?"明日":diff===-1?"昨日":diff>1?`${diff}日後`:"";
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function thumb(url, w){ return url ? `${url}?w=${w}&fm=webp` : ""; }
function md(ymd){ const [,m,d]=ymd.split("-"); return `${+m}/${+d}`; }
function when(t){ return new Date(t).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
const openIds = new Set();

// ---------- X投稿文（稼働開始のお知らせ） ----------
let postSel = new Set(ls.get("postSel", []));
let postCfg = ls.get("postCfg", { place: "2階プライズ", fixed: "#ベネクス平塚 #クレゲ #クレーンゲーム", off: [] });
function savePost(){ ls.set("postSel", [...postSel]); ls.set("postCfg", postCfg); }
function selected(){
  const byId = new Map((state.data?.prizes || []).map(p => [p.id, p]));
  return [...postSel].map(id => byId.get(id)).filter(Boolean);
}
function renderPostbar(){
  const n = selected().length;
  $("#postbar").classList.toggle("show", n > 0);
  $("#postCount").textContent = `投稿候補 ${n}件`;
}
// 商品名から作品名を推測してハッシュタグにする
const NOT_TITLE = /^(劇場版|映画|TVアニメ|アニメ|TV|New|NEW|ぷちっしゅ!?|ぴんぐるみ|ちびぐるみ|おおきな)$/;
const PRODUCT_LINE = /^(MAXIMATIC|BiCute|Grandista|Luminasta|Desktop|Trio-Try-iT|Aqua|FIGURIZM|SOFVIMATES|Coreful|VIVIT|XSTELLAR|Figure|Relax|GLITTER|VIBRATION|Noodle|Q)/i;
const clean = (t) => t.replace(/^(TV|劇場版|映画)?アニメ/, "").replace(/[^\p{L}\p{N}_ー]/gu, "");
function titleTag(name){
  const n = name.normalize("NFKC");
  const m = n.match(/[『「]([^』」]+)[』」]/);
  let t;
  if (m) t = m[1];
  else {
    const seg = n.split(/\s+/).filter(Boolean);
    while (seg.length > 1 && NOT_TITLE.test(seg[0])) seg.shift();   // 「劇場版」「ぷちっしゅ!」などは作品名ではない
    const first = seg[0] || "";
    t = first;
    // 英字の単語が続く作品名（BanG Dream!、METAL GEAR SOLID など）はつなげる。景品シリーズ名で止める
    for (let i = 1; /^[A-Za-z][A-Za-z!.'&]*$/.test(t.replace(/\s/g, "")) && i < seg.length && i < 4
         && /^[A-Za-z]/.test(seg[i]) && !PRODUCT_LINE.test(seg[i]); i++) t += seg[i];
    if (clean(t).length > 20) t = first;
  }
  t = clean(t);
  return t.length >= 2 && t.length <= 20 ? "#" + t : "";
}
// Xの文字数（全角=2、半角=1、上限280。表示は全角換算）
function xLength(text){
  let w = 0;
  const seg = new Intl.Segmenter("ja", { granularity: "grapheme" });
  for (const { segment } of seg.segment(text)){
    const cp = segment.codePointAt(0);
    const light = cp <= 0x10ff || (cp >= 0x2000 && cp <= 0x200d) || (cp >= 0x2010 && cp <= 0x201f) || (cp >= 0x2032 && cp <= 0x2037);
    w += light && segment.length === 1 ? 1 : 2;
  }
  return w;
}
function buildPost(){
  const items = selected();
  const auto = [...new Set(items.map(p => titleTag(p.name)).filter(Boolean))];
  const fixed = postCfg.fixed.split(/\s+/).filter(Boolean).map(t => t.startsWith("#") ? t : "#" + t);
  const tags = [...new Set([...auto, ...fixed])].filter(t => !postCfg.off.includes(t));
  const lines = ["🌈プライズ景品入荷情報🌈", ...items.map(p => "・" + p.name.normalize("NFKC").replace(/\s+/g, " ").trim()),
    `${postCfg.place}にて稼働中💖`, "", tags.join(" ")];
  return { text: lines.join("\n").trim(), allTags: [...new Set([...auto, ...fixed])], items };
}
function openComposer(){
  $("#cPlace").value = postCfg.place;
  $("#cFixed").value = postCfg.fixed;
  refreshComposer();
  $("#cInfo").textContent = "";
  $("#composer").showModal();
}
function refreshComposer(){
  const { text, allTags, items } = buildPost();
  $("#cText").value = text;
  $("#cTags").innerHTML = allTags.map(t => `<button type="button" data-tag="${esc(t)}" aria-pressed="${!postCfg.off.includes(t)}">${esc(t)}</button>`).join("");
  $("#cImgs").innerHTML = items.filter(p => p.image).slice(0, 4)
    .map(p => `<a href="${esc(p.image)}" target="_blank" rel="noopener"><img src="${esc(thumb(p.image,300))}" alt="" title="${esc(p.name)}"></a>`).join("")
    || `<p>画像はありません</p>`;
  updateCount();
}
function updateCount(){
  const w = xLength($("#cText").value);
  const el = $("#cCount");
  el.textContent = `${Math.ceil(w / 2)} / 140字（全角換算）${w > 280 ? "　上限を超えています。商品を減らすか2回に分けてください" : ""}`;
  el.classList.toggle("over", w > 280);
}

function render(){
  const { data } = state; if(!data) return;
  const today = jstToday();
  const words = state.q.split(/\s+/).map(norm).filter(Boolean);
  const searching = words.length > 0;
  const byStatus = !!state.stFilter;
  const [from, to] = rangeOf((searching || byStatus) ? "all" : state.range, today);

  document.querySelectorAll(".chip[data-range]").forEach(b => {
    b.setAttribute("aria-pressed", String(!searching && !byStatus && b.dataset.range === state.range));
    b.disabled = searching || byStatus;
  });
  document.querySelectorAll(".chip[data-st]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.st === state.stFilter)));

  let items = data.prizes.filter(p => p.date >= from && p.date <= to);
  if (searching) items = items.filter(p => words.every(w => p._n.includes(w)));
  if (byStatus) items = items.filter(p => statuses[p.id]?.s === state.stFilter);
  const hereCount = items.filter(p => p._here).length;
  if (state.onlyHere && !searching) items = items.filter(p => p._here);

  items.sort((a,b) => {
    const fa = a.date >= today, fb = b.date >= today;
    if (fa !== fb) return fa ? -1 : 1;
    return fa ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
  });

  const parts = [searching ? `「${state.q}」${items.length}件（平塚あり ${hereCount}件）` : `${items.length}件`, `${when(data.updatedAt)} 更新`];
  if (sync.url) parts.push(syncMsg || (pending.size ? `未送信 ${pending.size}件` : sync.last ? `${when(sync.last)} 同期` : ""));
  $("#status").textContent = parts.filter(Boolean).join("・");
  renderPostbar();

  if (!items.length){
    $("#list").innerHTML = `<p class="empty">${searching
      ? "該当する景品はありません。<br>作品名を短くするか、キャラ名だけで検索してください。"
      : byStatus ? `「${state.stFilter}」の景品はありません。` : "この期間の入荷予定はありません。"}</p>`;
    return;
  }

  const hl = (name) => {
    let out = esc(name);
    if (!searching) return out;
    for (const w of state.q.split(/\s+/).filter(Boolean)){
      const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
      out = out.replace(re, m => `<mark>${m}</mark>`);
    }
    return out;
  };

  let html = "", cur = "";
  for (const p of items){
    if (p.date !== cur){
      cur = p.date;
      const rel = relLabel(p.date, today);
      html += `<div class="day"><b>${md(p.date)}</b><span>（${WD[dow(p.date)]}）</span>${rel?`<span class="rel">${rel}</span>`:""}</div>`;
    }
    const st = statuses[p.id];
    const others = p.stores.filter(s => s !== "hiratsuka").map(s => data.storeNames[s]).join("・");
    const tags = [
      st?.s ? `<span class="tag ${st.s}">${st.s}</span>` : "",
      postSel.has(p.id) ? `<span class="tag post">投稿候補</span>` : "",
      p._here ? `<span class="tag here">平塚あり</span>` : `<span class="tag away">平塚なし（${others || "—"}）</span>`,
      p.dateChangedAt ? `<span class="tag moved">日付変更 ${md(p.prevDate)}→${md(p.date)}</span>` : "",
      p.firstSeen && p.firstSeen >= addDays(today,-2) ? `<span class="tag new">新着</span>` : "",
    ].join("");
    const img = p.image ? `<img loading="lazy" src="${thumb(p.image,160)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg'}))">` : `<div class="noimg"></div>`;
    const open = openIds.has(p.id);
    const btns = ["", ...STATUSES].map(s =>
      `<button type="button" class="${s || "none"}" data-set="${s}" aria-pressed="${(st?.s || "") === s}">${s || "未設定"}</button>`).join("");
    html += `<article class="row${p._here?"":" off"}${open?" open":""}" data-id="${esc(p.id)}">
      <button class="head" type="button" aria-expanded="${open}">${img}<div><div class="name">${hl(p.name)}</div><div class="meta">${tags}</div></div></button>
      <div class="detail">${open ? detailHtml(p, st, btns) : ""}</div></article>`;
  }
  $("#list").innerHTML = html;
}
function detailHtml(p, st, btns){
  const img = p.image ? `<img src="${esc(thumb(p.image,800))}" alt="景品画像">` : `<p>画像はありません</p>`;
  const note = st?.t ? `<p>状態の更新: ${when(st.t)}</p>` : "";
  const on = postSel.has(p.id);
  const pick = `<button type="button" class="pick" data-pick aria-pressed="${on}">${on ? "✓ 投稿候補に入っています（タップで外す）" : "＋ 投稿候補に入れる"}</button>`;
  return `<div class="st-buttons" role="group" aria-label="在庫状態">${btns}</div>${pick}${img}${note}`;
}

$("#list").addEventListener("click", (e) => {
  const row = e.target.closest(".row"); if(!row) return;
  const id = row.dataset.id;
  const setBtn = e.target.closest("[data-set]");
  if (setBtn){ setStatus(id, setBtn.dataset.set); return; }
  if (e.target.closest("[data-pick]")){ postSel.has(id) ? postSel.delete(id) : postSel.add(id); savePost(); render(); return; }
  if (e.target.closest(".head")){
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  }
});

let t;
$("#q").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); render(); scrollTo(0,0); }, 120); });
$("#clear").addEventListener("click", () => { $("#q").value = ""; state.q = ""; render(); $("#q").focus(); });
document.querySelectorAll(".chip[data-range]").forEach(b => b.addEventListener("click", () => { state.range = b.dataset.range; render(); scrollTo(0,0); }));
document.querySelectorAll(".chip[data-st]").forEach(b => b.addEventListener("click", () => {
  state.stFilter = state.stFilter === b.dataset.st ? "" : b.dataset.st; render(); scrollTo(0,0);
}));
$("#onlyHere").addEventListener("click", (e) => {
  state.onlyHere = !state.onlyHere; e.currentTarget.setAttribute("aria-pressed", String(state.onlyHere)); render();
});

// 投稿
$("#postMake").addEventListener("click", openComposer);
$("#postClear").addEventListener("click", () => { if (confirm("投稿候補をすべて外しますか？")){ postSel.clear(); savePost(); render(); } });
$("#cPlace").addEventListener("input", (e) => { postCfg.place = e.target.value; savePost(); refreshComposer(); });
$("#cFixed").addEventListener("change", (e) => { postCfg.fixed = e.target.value; savePost(); refreshComposer(); });
$("#cTags").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  const t = b.dataset.tag;
  postCfg.off = postCfg.off.includes(t) ? postCfg.off.filter(x => x !== t) : [...postCfg.off, t];
  savePost(); refreshComposer();
});
$("#cText").addEventListener("input", updateCount);
$("#cClose").addEventListener("click", () => $("#composer").close());
$("#cCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#cText").value); }
  catch { $("#cText").select(); document.execCommand("copy"); }
  $("#cInfo").textContent = "コピーしました。投稿が終わったら「解除」で候補を空にしてください。";
});
$("#cOpenX").addEventListener("click", () => {
  window.open("https://x.com/intent/post?text=" + encodeURIComponent($("#cText").value), "_blank", "noopener");
});

// 設定
const dlg = $("#settings");
function showSyncInfo(){
  $("#syncInfo").textContent = !sync.url ? "未設定のときは、この端末の中だけに保存されます。"
    : syncMsg || (sync.last ? `最終同期: ${when(sync.last)}` : "まだ同期していません。");
}
$("#gear").addEventListener("click", () => { $("#syncUrl").value = sync.url; $("#syncKey").value = sync.key; showSyncInfo(); dlg.showModal(); });
function readForm(){ sync.url = $("#syncUrl").value.trim(); sync.key = $("#syncKey").value; ls.set("sync", sync); }
$("#closeSettings").addEventListener("click", () => { readForm(); dlg.close(); pull(); });
$("#syncNow").addEventListener("click", async () => { readForm(); $("#syncInfo").textContent = "同期中…"; await pull(); showSyncInfo(); });

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
addEventListener("online", () => pull());

const fit = () => document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px");
addEventListener("resize", fit); fit();

fetch("data.json", { cache: "no-cache" })
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    for (const p of d.prizes){ p._n = norm(p.name + " " + (p.kana || "")); p._here = p.stores.includes("hiratsuka"); }
    state.data = d; render(); pull();
  })
  .catch(() => { $("#status").textContent = "データを読み込めませんでした。通信状態を確認して、再読み込みしてください。"; });
</script>
</body>
</html>
